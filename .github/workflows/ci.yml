name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -v -race ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      - run: GOOS=windows GOARCH=amd64 go build ./...
