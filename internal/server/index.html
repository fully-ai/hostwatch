<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HostWatch — Infrastructure Monitor</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
    .hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
    .bar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin: 6px 0 10px; }
    .fill { height: 100%; background: #2f81f7; }
    svg { width: 100%; height: 90px; background: #0d1117; border-radius: 6px; margin-top: 8px; }
    .alert { background: #3b1219; border: 1px solid #f85149; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>HostWatch</h1>
  <div id="hosts" class="hosts"></div>
  <h2>Recent Alerts</h2>
  <div id="alerts"></div>
  <script>
    function sparkline(samples, key, color) {
      if (!samples.length) return '';
      const w = 280, h = 80;
      const pts = samples.map((s, i) => {
        const x = samples.length === 1 ? w : (i / (samples.length - 1)) * w;
        const y = h - (Math.min(100, Math.max(0, s[key])) / 100) * (h - 10) - 5;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      return `<polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}" />`;
    }
    async function refresh() {
      const { hosts } = await fetch('/api/hosts').then(r => r.json());
      const box = document.getElementById('hosts');
      box.innerHTML = '';
      for (const h of hosts) {
        const hist = await fetch(`/api/hosts/${encodeURIComponent(h.host_id)}/history`).then(r => r.json());
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <strong>${h.hostname}</strong> <small>(${h.os}/${h.arch}, ${h.num_cpu} CPUs)</small>
          <div>CPU: ${h.cpu_percent}%</div><div class="bar"><div class="fill" style="width:${h.cpu_percent}%"></div></div>
          <div>Memory: ${h.mem_percent}%</div><div class="bar"><div class="fill" style="width:${h.mem_percent}%"></div></div>
          <div>Disk: ${h.disk_percent}%</div><div class="bar"><div class="fill" style="width:${h.disk_percent}%"></div></div>
          <div>Net RX/TX: ${h.net_rx_bytes} / ${h.net_tx_bytes} B</div>
          <svg viewBox="0 0 280 80">${sparkline(hist.samples, 'cpu_percent', '#3b82f6')}${sparkline(hist.samples, 'mem_percent', '#22c55e')}</svg>
        `;
        box.appendChild(card);
      }
      const { alerts } = await fetch('/api/alerts').then(r => r.json());
      const ab = document.getElementById('alerts');
      ab.innerHTML = alerts.slice(-10).reverse().map(a => `<div class="alert">${a.triggered_at}: ${a.message}</div>`).join('') || '<div>No alerts</div>';
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
